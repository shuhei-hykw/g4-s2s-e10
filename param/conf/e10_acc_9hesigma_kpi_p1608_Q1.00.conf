#
# e10_acc_9hesigma_kpi_p1608_Q1.00.conf
# S-2S acceptance production AT the rigidity-ceiling boundary point
# p_beam=1.6078 GeV/c (Q1SCALE=Q2SCALE=D1SCALE=1.0 -- the field-map's
# own TOSCA calculation point, used as a provisional ceiling in the
# absence of a documented S-2S hardware rating; see k0-background.md
# section 7). This REPLACES the analytic rigidity_scale() rescale of
# the p_beam=1.5 GeV/c acceptance grid (Q=0.93) with a genuine Geant4
# acceptance simulation at the correct field setting and the correct
# signal pi+ momentum locus for THIS beam momentum (~1.457-1.474
# GeV/c over theta=0-20deg, vs ~1.36-1.39 GeV/c at 1.5 GeV/c).
# GenMomCent/GenMomBite chosen the same way as the p128_Q0.93
# reference (window comfortably straddling the signal locus): here
# 1.10-1.70 GeV/c, locus sitting in the upper half.
#

