#
# e10_k0_background_kpi.conf
# K0 background for 9Be(K-,pi+) 9_Lambda_He: K-p->K0bar n (Conforto
# et al. Nucl. Phys. B105 (1976) c.m. angular distribution at their
# highest point, 1.355 GeV/c). Generator 1001 (E10 namespace: E63
# uses 63xx, E70 uses 70xx/75xx, E90 uses 90xx -- see analysis-note.md
# 2026-07-12 21:xx entry) emits the K0bar itself ("anti_kaon0") as a
# real Geant4 primary; DECAY:1 lets Geant4's own
# physics handle the K0_S/K0_L mixing, each species' full decay table
# (with real PDG branching ratios) and the flight length before decay
# (from each species' real proper lifetime), through the real
# geometry/field/materials -- see the file-level comment on
# S2SPrimaryGeneratorAction::GenerateK0Production. Reuses the same
# geometry/optics as the signal production (Q1=Q2=D1SCALE=0.93).
# Acceptance uses the common e10 downstream-counter criterion
# (Experiment==10 in S2SAnaManager::EndOfEvent: charged hit in
# TOF/AC1(Cherenkov threshold)/WC from any track), since the decay
# products here are secondaries and would not satisfy the historical
# IsPrimary()-gated trigger flags. See analysis-note.md 2026-07-12
# entries.
#

Experiment:	10

DCGEO:		param/DCGEO/DCGeomParam_e10_9hesigma_kpi
DSIZE:		param/DSIZE/DetSize_E10_9hesigma_kpi
HIST:		param/HIST/HistParam_E10_9hesigma_kpi_p128
FLDMAP:         fieldmap/BH14full_20230711.dat
Q1SCALE:	0.93
Q2SCALE:	0.93
D1SCALE:	0.93

Generator:	1001
GenPID:		3      # unused by the e10 acceptance criterion; kept
                       # for the legacy TriggerFlag-suffixed histograms

###### PhysicsList
EM:		0
DECAY: 		1
HADRON: 	0

TargetMaterial: Be

CheckOverlap:	0

TREE:		0
