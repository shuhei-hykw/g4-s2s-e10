#
# e10_acc_9hesigma_kpi_scale1_flat.conf
# S-2S acceptance production at the FIXED field setting
# Q1SCALE=Q2SCALE=D1SCALE=1.0 (the provisional rigidity ceiling),
# with a wide momentum window (1.05-1.95 GeV/c) so this ONE
# production can be reused to evaluate signal acceptance at any
# p_beam in 1.6-1.8 GeV/c WITHOUT retuning the magnet -- i.e.
# decoupling beam momentum from magnet retuning, to answer "what if
# we push p_beam higher but leave S-2S capped at the ceiling?" (see
# k0-background.md section 7). Uses the corrected target geometry
# (50x50x20mm, uniform-in-volume vertex) already in place.
#

Experiment:	10

DCGEO:		param/DCGEO/DCGeomParam_e10_9hesigma_kpi
DSIZE:		param/DSIZE/DetSize_E10_9hesigma_kpi
HIST:		param/HIST/HistParam_E10_9hesigma_kpi_scale1
FLDMAP:         fieldmap/BH14full_20230711.dat
Q1SCALE:	1.0
Q2SCALE:	1.0
D1SCALE:	1.0

Generator:	2
GenPID:		3
GenMomCent:	1.50
GenMomBite:	0.90
GenTheta:	20
GenThetaFlat:	1

EM:		0
DECAY: 		0
HADRON: 	0

TargetMaterial: Be
CheckOverlap:	0
TREE:		0
