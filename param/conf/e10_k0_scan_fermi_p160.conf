#
# e10_k0_scan_fermi_p160.conf
# Beam-momentum scan point: p_beam=1.60 GeV/c for K0 background
# (Generator 1001), WITH Fermi motion of the struck proton enabled
# (K0FermiMotion:1, exact 1p HO momentum density, chi5 with sigma=
# hbarc/(b~ sqrt2)=81.3 MeV/c + spectator-recoil energy split; see
# analysis-note.md 2026-07-14 Fermi-fix entry).
# Q1=Q2=D1SCALE retuned proportionally to the signal pi+ momentum
# shift at theta=0 (rigidity-scaling assumption: fields retuned to
# keep the signal centered in the acceptance the same way the
# validated p_beam=1.5 GeV/c, scale=0.93 setting does).
# See beam_momentum_scan.py / estimate.md for the derivation.
#

Experiment:	10

DCGEO:		param/DCGEO/DCGeomParam_e10_9hesigma_kpi
DSIZE:		param/DSIZE/DetSize_E10_9hesigma_kpi
HIST:		param/HIST/HistParam_E10_9hesigma_kpi_p128
FLDMAP:         fieldmap/BH14full_20230711.dat
Q1SCALE:	0.9944
Q2SCALE:	0.9944
D1SCALE:	0.9944

Generator:	1001
K0FermiMotion:	1
K0BeamMom:	1.60
GenPID:		3      # unused by the e10 acceptance criterion; kept
                       # for the legacy TriggerFlag-suffixed histograms

###### PhysicsList
EM:		0
DECAY: 		1
HADRON: 	0

TargetMaterial: Be

CheckOverlap:	0

TREE:		0
